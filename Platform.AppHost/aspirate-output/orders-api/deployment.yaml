---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    app: orders-api
spec:
  minReadySeconds: 60
  replicas: 1
  selector:
    matchLabels:
      app: orders-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
      - name: orders-api
        image: orders-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: Grpc
          containerPort: 5272
        - name: Http
          containerPort: 5172
        - name: https
          containerPort: 5272
        envFrom:
        - configMapRef:
            name: orders-api-env
      terminationGracePeriodSeconds: 180