---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-api
  labels:
    app: reviews-api
spec:
  minReadySeconds: 60
  replicas: 1
  selector:
    matchLabels:
      app: reviews-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: reviews-api
    spec:
      containers:
      - name: reviews-api
        image: reviews-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: Grpc
          containerPort: 5280
        - name: Http
          containerPort: 5180
        - name: https
          containerPort: 5280
        envFrom:
        - configMapRef:
            name: reviews-api-env
      terminationGracePeriodSeconds: 180