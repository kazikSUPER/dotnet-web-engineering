apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: default
  labels:
    app: platform
type: Opaque
stringData:
  ConnectionStrings__CatalogDb: "Server=dotnet-web-sql;Database=CatalogDb;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True"
  ConnectionStrings__OrdersDb: "Server=dotnet-web-sql;Database=OrdersDb;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True"
  ConnectionStrings__ReviewsDb: "mongodb://admin:admin123@dotnet-web-mongo:27017/ReviewsDb?authSource=admin"
  ConnectionStrings__IdentityDb: "Server=dotnet-web-sql;Database=IdentityDb;User Id=sa;Password=YourSecurePassword123!;TrustServerCertificate=True"
  ConnectionStrings__redis: "dotnet-web-redis:6379"
  ConnectionStrings__messaging: "amqp://guest:guest@dotnet-web-rabbitmq:5672"
  Auth__SigningKey: "SuperSecretAuthSigningKeyWithAtLeast32BytesForHmacSha256Security!"
