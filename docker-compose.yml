name: dotnet-web

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dotnet-web-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - dotnet-web-sql-data:/var/opt/mssql
    networks:
      - dotnet-web
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  mongo:
    image: mongo:8.3
    container_name: dotnet-web-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - dotnet-web-mongo-data:/data/db
    networks:
      - dotnet-web
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

networks:
  dotnet-web:
    name: dotnet-web
    driver: bridge

volumes:
  dotnet-web-sql-data:
    name: dotnet-web-sql-data
  dotnet-web-mongo-data:
    name: dotnet-web-mongo-data
